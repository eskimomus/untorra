<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>untorra</title>
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="stylesheet" href="style.css?v=42">
</head>
<body>
<div id="game">
  <div id="stage">
    <div id="scene-wrap">
      <img id="img-a" class="scene-img" alt="">
      <img id="img-b" class="scene-img" alt="">
    </div>
    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="tablo-layer"></div>
    <div id="collider-layer"></div>
    <div id="hotspot-layer"></div>
    <div id="fade-overlay"></div>

    <div id="loading-indicator"><div class="loading-row"><img class="menu-img" src="assets/menu-text/loading-word.png?v=1" alt="loading"><span class="loading-dots-slot"><img id="loading-dots-img" class="menu-img" src="assets/menu-text/loading-dots-1.png?v=1" alt="..."></span></div></div>

    <div id="title-screen">
      <div class="menu-title"><img class="title-logo" src="assets/menu-text/title-untorra.png?v=8" alt="untorra"></div>
      <nav class="menu-list">
        <button id="menu-continue" class="menu-item"><img class="menu-img" src="assets/menu-text/item-continue-inactive.png?v=2" alt="continue"></button>
        <button id="menu-newgame" class="menu-item active"><img class="menu-img" src="assets/menu-text/item-newgame.png?v=2" alt="new game"></button>
        <button id="menu-credits" class="menu-item active"><img class="menu-img" src="assets/menu-text/item-credits.png?v=2" alt="credits"></button>
        <button id="menu-store" class="menu-item active"><img class="menu-img" src="assets/menu-text/item-physical-ost.png?v=1" alt="physical OST"></button>
      </nav>
    </div>

    <div id="credits-screen" class="hidden">
      <button id="credits-back" class="menu-item active menu-title"><img class="menu-img" src="assets/menu-text/item-back.png?v=2" alt="< back"></button>
      <div class="menu-list credits-body">
        <div class="credits-line credits-name-line"><a class="credits-link" id="credits-link-swan" href="https://matt-swan.art" target="_blank" rel="noopener noreferrer"><img class="menu-img" id="credits-img-swan" src="assets/menu-text/credits-matthew-swan.png?v=1" alt="matthew swan"></a><img class="menu-img" src="assets/menu-text/credits-comma-2026.png?v=1" alt=", 2026"></div>
        <div class="credits-line"><img class="menu-img" src="assets/menu-text/credits-special-thanks-to.png?v=1" alt="special thanks to"><a class="credits-link" id="credits-link-riley" href="https://www.instagram.com/withclosedeyes.png?igsi=em05aWdpNzhlYTFz" target="_blank" rel="noopener noreferrer"><img class="menu-img" id="credits-img-riley" src="assets/menu-text/credits-riley-w.png?v=1" alt="Riley W"></a></div>
        <div class="credits-line"><img class="menu-img" src="assets/menu-text/credits-line3.png?v=1" alt="from Empyrean for the"></div>
        <div class="credits-line"><img class="menu-img" src="assets/menu-text/credits-line4.png?v=1" alt="incredible physical artwork"></div>
      </div>
    </div>
  </div>
</div>
<script src="game.js?v=74"></script>
</body>
</html>
